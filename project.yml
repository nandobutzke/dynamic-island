name: DynamicIsland
options:
  bundleIdPrefix: com.fernandobutzke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: Dynamic Island
    INFOPLIST_FILE: Resources/Info.plist
    GENERATE_INFOPLIST_FILE: false
    LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: false
targets:
  DynamicIsland:
    type: application
    platform: macOS
    sources:
      - path: Sources/DynamicIsland
        excludes:
          - Resources
          - "**/*.json"
          - graphify-out
      - path: Sources/DynamicIsland/Resources
        type: resources
        buildPhase: resources
    dependencies:
      - sdk: EventKit.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fernandobutzke.DynamicIsland
        PRODUCT_NAME: DynamicIsland
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LSUIElement: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
